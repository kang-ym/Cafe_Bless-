<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Bless</title>
    <!-- SEO -->
    <meta name="title" content="Cafe Bless - オンライン注文システム">
    <meta name="description" content="Cafe Blessはスマホで簡単に注文できる、心温まるカフェのオンライン注文サービスです。">
    <meta name="keywords" content="カフェ, 注文, Cafe Bless, コーヒー, オンライン注文, 韓国カフェ, 日本カフェ, 카페블레스">
    <meta name="author" content="Cafe Bless 開発チーム">

    <!-- Open Graph (SNS 공유용) -->
    <meta property="og:title" content="Cafe Bless - オンライン注文システム">
    <meta property="og:description" content="スマホで簡単注文！">
    <meta property="og:image" content="https://cafe-bless.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://cafe-bless.com">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Cafe Bless - オンライン注文システム">
    <meta name="twitter:description" content="スマホで簡単注文！やさしいカフェ体験をお届け。">
    <meta name="twitter:image" content="https://cafe-bless.com/img/og-image.png">

    <!-- Favicon (아이콘이 있다면) -->
    <link rel="icon" href="https://cafe-bless.com/favicon.png" type="image/png">    
    <!-- googlefont -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=M+PLUS+Rounded+1c&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- fontawesome -->
    <script src="https://kit.fontawesome.com/fcbf2015e7.js" crossorigin="anonymous"></script>
    <!-- Firebase App (필수) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <!-- Firebase Database -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <!-- 공통 초기화 -->
    <script type="module" src="./src/firebase-init.js"></script>
    
    <!-- css -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- Java script -->
    <script type="module" src="./src/main.js" defer></script>
    <script type="module" src="./src/use.js" defer></script>
</head>
<body>

    <div class="mobile-container">
        <div class="use-container" id="useContainer">
            <div class="use-img-box">
                <!-- 설명 이미지 또는 안내 내용 -->
                <img src="./img/use.webp" alt="사용 방법 안내">
                <button class="close-btn">
                    <span></span>
                </button>
                <!-- 오늘 하루 보지 않기 -->
                <div class="do-not-show">
                    <input type="checkbox" id="hideToday">
                    <label for="hideToday">今日は見ない</label>
                </div>
            </div>
        </div>

        <header>
            <div class="logo-container">
                <h1>Cafe Bless</h1>
            </div>
            <!-- /.logo-container -->
            <a href="login.html" class="manager-btn">Manager Login</a>
        </header>
        <!-- header -->
        
        <main>
            <div class="date-container">
                <div class="date-box">
                    <p id="getdate"></p>
                </div>
                <button class="use-btn">使い方</button>
            </div>

            <div class="order-box">
                <p id="orderResult">ご注文ください。</p>
            </div>

            <div class="coffee-container">
                <div class="select-box">
                    <div class="coffe-box">
                        <input type="radio" name="coffee" value="americano" id="americano" checked>
                        <label for="americano">
                            <div class="img-box">
                                <h3 data-en="Americano">
                                    <span class="custom-check"></span>
                                    アメリカーノ
                                </h3>
                                <img src="./img/1.webp" alt="">
                            </div>
                        </label>
                        <p class="Price" data-pricer="200" data-pricel="300">L : 300円 R : 200円</p>    
                    </div>
                    <div class="coffe-box">
                        <input type="radio" name="coffee" value="latte" id="latte">
                        <label for="latte">
                            <div class="img-box">
                                <h3 data-en="Latte">
                                    <span class="custom-check"></span>
                                    ラテ
                                </h3>
                                <img src="./img/2.webp" alt="">
                            </div>
                        </label>
                        <p class="Price" data-pricer="200" data-pricel="300">L : 300円 R : 200円</p>    
                    </div>
                    <div class="coffe-box">
                        <input type="radio" name="coffee" value="vanilla-latte" id="vanillaLatte">
                        <label for="vanillaLatte">
                            <div class="img-box">
                                <h3 data-en="Vanilla Latte">
                                    <span class="custom-check"></span>
                                    バニララテ
                                </h3>
                                <img src="./img/3.webp" alt="">
                            </div>
                        </label>
                        <p class="Price" data-pricer="250" data-pricel="350">L : 350円 R : 250円</p>    
                    </div>
                    <div class="coffe-box">
                        <input type="radio" name="coffee" value="caramel-latte" id="caramelLatte">
                        <label for="caramelLatte">
                            <div class="img-box">
                                <h3 data-en="Caramel Latte">
                                    <span class="custom-check"></span>
                                    キャラメルラテ
                                </h3>
                                <img src="./img/4.webp" alt="" style="object-position: center -150px;">
                            </div>
                        </label>
                        <p class="Price" data-pricer="250" data-pricel="350">L : 350円 R : 250円</p>    
                    </div>
                </div>
                <div class="info-box">
                    <div class="hot-radio input-box">
                        <label for="hotOption" class="hot-block ㅁㅊ">
                          <i class="fa-solid fa-fire"></i>
                          <span class="hot-text temp-text">HOT</span>
                        </label>
                        <input type="radio" name="temperature" value="hot" id="hotOption" checked>
                      
                        <input type="radio" name="temperature" value="cold" id="coldOption">
                        <label for="coldOption" class="cold-block">
                          <i class="fa-regular fa-snowflake"></i>
                          <span class="cold-text temp-text">COLD</span>
                        </label>
                      </div>
                      
                    
                    <div class="size-radio input-box">
                        <input type="radio" name="size" value="L" id="largeOption" checked>
                        <label for="largeOption">L</label>
                        <input type="radio" name="size" value="R" id="regularOption" >
                        <label for="regularOption">R</label>

                    </div>
                    <div class="customer-name input-box">
                        <label>注文者:</label>
                        
                        <!-- 그룹 + 이름 선택 -->
                        <div class="name-box">
                            <select id="group">
                                <option value="">グループ</option>
                                <option value="信仰">信仰</option>
                                <option value="希望">希望</option>
                                <option value="愛">愛</option>
                                <option value="guest">ゲスト</option>
                            </select>
                            <div id="nameBox"></div>
                        </div>
                    </div>
                    
                    

                    <div class="coffee-quantity input-box">
                        <label>注文数:</label>
                        <input type="number" id="coffeeQuantity" min="1" value="1">    
                    </div>
                </div> <!-- .info-box -->
            </div>

            <button class="order-btn">注文</button>

        </main>
        <!-- main -->

        <footer>
            <p><small>&copy; Cofe Bless all rights reserved.</small></p>
        </footer>
        <!-- footer -->
    </div>

    <!-- 팝업 -->
    <div id="popupOverlay" class="popup-overlay">
        <div id="popupMessage" class="popup-message">注文が正常に処理されました。</div>
    </div>


</body>
<script>
  document.querySelector('.use-btn').addEventListener('click', () => {
    document.getElementById('useContainer').style.display = 'flex';
  });
</script>
</html>

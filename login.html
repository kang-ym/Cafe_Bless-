<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <!-- Firebase 초기화 -->
  <script type="module" src="./src/firebase-init.js"></script>

  <!-- js -->
  <script type="module" src="./src/login.js" defer></script>

  <!-- CSS는 선택 -->
  <style>
    *{
      padding: 0;
      margin: 0;

    }
      
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif; 
      padding: 80px; 
      text-align: center; 
    }
    input { 
      padding: 8px; 
      margin: 10px;
      width: 250px; 
    }
    button {
      padding: 10px 40px; 
      border-radius: 16px;
      outline: transparent;
      border: 1px solid transparent;
      background-color: #fcc7c7;
      margin-bottom: 80px;
      color: #333;
    }
    form{
      position: relative;
    }
    label{
      position: absolute;
      bottom: 7.3rem;
      right: 10px;
      display: flex;
      align-items: center;
      font-size: 12px;
    }
    #saveEmailCheckbox{
      width: 15px;
    }
    @media (width < 768px){
      body{
        display: block;
        padding: 0;
      }
      form {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        >h2{
          margin-bottom: 10px;
        }
        >input{
          margin: 0;
        }
      }

    }
  </style>
</head>
<body>
  <form id="loginForm">
    
    <h2>Manager Login</h2>
    <input type="email" id="email" placeholder="Email"><br />
    <input type="password" id= "passwordInput" placeholder="Password"><br />
    <button type="submit" id="loginBtn">ログイン</button>
    <label>
      <input type="checkbox" id="saveEmailCheckbox"> メールアドレスを保存
    </label>
  </form>
</body>
</html>
